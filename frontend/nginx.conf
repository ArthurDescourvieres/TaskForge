server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Health check du service frontend (S1-09). Déclaré avant le fallback SPA :
    # sans cette règle, /healthz renverrait index.html avec un 200, donc un
    # « service sain » même bundle cassé.
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"frontend"}';
    }

    # SPA : toutes les routes non-fichier renvoient index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
